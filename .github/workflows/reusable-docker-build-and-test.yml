name: Reusable Docker Build and Test

on:
  workflow_call:
    inputs:
      platform:
        description: 'Target platform (e.g., linux/amd64, linux/arm64)'
        required: true
        type: string
      target:
        description: 'Dockerfile target to build'
        required: false
        type: string
        default: 'service'
      tags:
        description: 'Docker image tag(s), comma-separated (first tag is used for running tests)'
        required: true
        type: string
      base-image:
        description: 'Base image name (build arg BASE_IMG)'
        required: false
        type: string
        default: 'ubuntu'
      base-image-tag:
        description: 'Base image tag (build arg BASE_IMG_TAG)'
        required: false
        type: string
        default: 'jammy-20250415.1'
      runner:
        description: 'GitHub runner to use'
        required: false
        type: string
        default: 'ubuntu-latest'
      use-qemu:
        description: 'Enable QEMU emulation (for cross-arch builds/runs)'
        required: false
        type: boolean
        default: false
      download-default-tokenizer:
        description: 'Set Docker build arg DOWNLOAD_DEFAULT_TOKENIZER'
        required: false
        type: boolean
        default: true
      test-selection:
        description: 'Test selection strategy (full or random)'
        required: false
        type: string
        default: 'full'
      random-count:
        description: 'Number of tests to run when test-selection=random'
        required: false
        type: string
        default: '100'
      pytest-markers:
        description: 'Pytest markers expression'
        required: false
        type: string
        default: 'not integration'
      coverage:
        description: 'Collect coverage.xml and upload it'
        required: false
        type: boolean
        default: true
    secrets:
      HF_ACCESS_TOKEN:
        required: false

jobs:
  build-and-test:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: ${{ inputs.use-qemu }}
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create HF token file (optional)
        env:
          HF_ACCESS_TOKEN: ${{ secrets.HF_ACCESS_TOKEN }}
        run: |
          mkdir -p ./scripts/private_local
          if [ -n "${HF_ACCESS_TOKEN}" ]; then
            printf '%s' "${HF_ACCESS_TOKEN}" > ./scripts/private_local/hf_token.txt
          fi

      - name: Build Docker image (load locally)
        run: |
          set -euo pipefail

          TAGS="${{ inputs.tags }}"
          TAG_ARGS=""

          sanitize_image_ref() {
            local ref="$1"
            local after_slash="${ref##*/}"

            # Only sanitize the *tag* portion (after the last ':', and only if
            # that ':' occurs after the last '/'). This avoids breaking
            # registries with ports like "registry:5000/repo:tag".
            if [[ "$after_slash" == *:* ]]; then
              local name="${ref%:*}"
              local tag="${ref##*:}"

              # Docker tags must match [A-Za-z0-9_][A-Za-z0-9_.-]{0,127}
              # Replace common offenders (like '/' from refs/heads/...) with '-'.
              local safe_tag="${tag//\//-}"
              safe_tag="${safe_tag// /-}"
              safe_tag="${safe_tag//:/-}"
              safe_tag="${safe_tag//[^A-Za-z0-9_.-]/-}"
              safe_tag="${safe_tag#[-.]}" # strip leading '-' or '.'
              safe_tag="${safe_tag:0:128}"

              if [[ -z "$safe_tag" ]]; then
                safe_tag="sha-${GITHUB_SHA}"
                safe_tag="${safe_tag:0:128}"
              fi

              printf '%s:%s' "$name" "$safe_tag"
              return 0
            fi

            printf '%s' "$ref"
          }

          IFS=',' read -ra TAG_ARR <<< "$TAGS"
          for t in "${TAG_ARR[@]}"; do
            t="$(echo "$t" | xargs)"
            if [ -n "$t" ]; then
              t="$(sanitize_image_ref "$t")"
              TAG_ARGS="$TAG_ARGS -t $t"
            fi
          done

          SECRET_ARG=""
          if [ -f ./scripts/private_local/hf_token.txt ] && [ -s ./scripts/private_local/hf_token.txt ]; then
            SECRET_ARG="--secret id=hf_token,src=./scripts/private_local/hf_token.txt"
          fi

          DOWNLOAD_DEFAULT_TOKENIZER="True"
          if [ "${{ inputs.download-default-tokenizer }}" != "true" ]; then
            DOWNLOAD_DEFAULT_TOKENIZER="False"
          fi

          docker buildx build \
            -f Dockerfile \
            --platform "${{ inputs.platform }}" \
            --load \
            --target "${{ inputs.target }}" \
            --build-arg GIT_COMMIT=${GITHUB_SHA} \
            --build-arg BASE_IMG="${{ inputs.base-image }}" \
            --build-arg BASE_IMG_TAG="${{ inputs.base-image-tag }}" \
            --build-arg DOWNLOAD_DEFAULT_TOKENIZER=$DOWNLOAD_DEFAULT_TOKENIZER \
            $SECRET_ARG \
            $TAG_ARGS \
            .

      - name: Run tests inside Docker container
        run: |
          set -euo pipefail

          TAGS="${{ inputs.tags }}"
          PLATFORM="${{ inputs.platform }}"
          MARKERS="${{ inputs.pytest-markers }}"
          TEST_PATHS="nemo_retriever/tests"

          sanitize_image_ref() {
            local ref="$1"
            local after_slash="${ref##*/}"
            if [[ "$after_slash" == *:* ]]; then
              local name="${ref%:*}"
              local tag="${ref##*:}"
              local safe_tag="${tag//\//-}"
              safe_tag="${safe_tag// /-}"
              safe_tag="${safe_tag//:/-}"
              safe_tag="${safe_tag//[^A-Za-z0-9_.-]/-}"
              safe_tag="${safe_tag#[-.]}"
              safe_tag="${safe_tag:0:128}"
              if [[ -z "$safe_tag" ]]; then
                safe_tag="sha-${GITHUB_SHA}"
                safe_tag="${safe_tag:0:128}"
              fi
              printf '%s:%s' "$name" "$safe_tag"
              return 0
            fi
            printf '%s' "$ref"
          }

          IFS=',' read -ra TAG_ARR <<< "$TAGS"
          IMAGE=""
          for t in "${TAG_ARR[@]}"; do
            t="$(echo "$t" | xargs)"
            if [ -n "$t" ]; then
              IMAGE="$(sanitize_image_ref "$t")"
              break
            fi
          done
          if [ -z "$IMAGE" ]; then
            echo "Error: no image tag found to run tests (inputs.tags was empty)"
            exit 1
          fi

          if [ "${{ inputs.download-default-tokenizer }}" = "true" ]; then
            # Verify the production image before test-only dependencies are
            # installed. Disabling networking proves both service variants
            # can use the tokenizer cache populated by the build argument.
            docker run --rm -i --network none --platform "$PLATFORM" \
              -e NEMO_RETRIEVER_IMAGE_TARGET="${{ inputs.target }}" \
              --entrypoint bash "$IMAGE" \
              -lc 'source /opt/retriever_runtime/bin/activate && python -' <<'PY'
          import importlib.util
          import os

          target = os.environ["NEMO_RETRIEVER_IMAGE_TARGET"]
          assert importlib.util.find_spec("tokenizers") is not None
          assert importlib.util.find_spec("huggingface_hub") is not None
          if target == "service":
              assert importlib.util.find_spec("transformers") is None
              assert os.environ.get("HF_HUB_OFFLINE") == "1"
          elif target == "service-gpu":
              assert os.environ.get("HF_HUB_OFFLINE") != "1"

          from nemo_retriever.common.modality.html.convert import html_bytes_to_chunks_df
          from nemo_retriever.common.modality.txt.split import (
              DEFAULT_TOKENIZER_MODEL_ID,
              txt_bytes_to_chunks_df,
          )
          from nemo_retriever.common.modality.txt.tokenizer_provider import load_chunk_tokenizer

          tokenizer = load_chunk_tokenizer(DEFAULT_TOKENIZER_MODEL_ID)
          assert tokenizer.encode("offline tokenizer smoke test")

          txt = txt_bytes_to_chunks_df(b"offline tokenizer smoke test", "smoke.txt")
          html = html_bytes_to_chunks_df(
              b"<html><body><p>offline tokenizer smoke test</p></body></html>",
              "smoke.html",
          )
          assert not txt.empty
          assert not html.empty
          print(f"{target} offline TXT/HTML chunking smoke test passed")
          PY
          fi

          if [ "${{ inputs.test-selection }}" != "full" ] && [ "${{ inputs.test-selection }}" != "random" ]; then
            echo "Error: test-selection must be 'full' or 'random'"
            exit 1
          fi

          if [ "${{ inputs.coverage }}" = "true" ]; then
            COV_ARGS="--cov=nemo_retriever/src/nemo_retriever --cov-report term --cov-report xml:/tmp/coverage.xml"
          else
            COV_ARGS=""
          fi

          # Use uv so pyproject uv sources are honored for nightly Nemotron packages.
          if [ "${{ inputs.test-selection }}" = "full" ]; then
            CMD="set -euo pipefail; source /opt/retriever_runtime/bin/activate; uv pip install -e \"./nemo_retriever[all,dev]\" && uv pip install pytest pytest-cov && python -m pytest -m \"$MARKERS\" $COV_ARGS nemo_retriever/tests"
            # Run the CPU-only Ray integration check separately from the mocked unit suite.
            CMD="$CMD && python -m pytest -m integration nemo_retriever/tests/test_pipeline_graph.py::TestRayDataExecutor::test_strict_blocks_produce_full_batches_with_real_ray"
          else
            N="${{ inputs.random-count }}"
            # Read node IDs into an array instead of word-splitting the file, so
            # a parametrized ID containing whitespace cannot corrupt the run.
            # An empty selection must fail loudly: passing no node IDs would
            # silently collect the whole suite, which never finishes under QEMU.
            CMD="set -euo pipefail; \
              source /opt/retriever_runtime/bin/activate; \
              uv pip install -e \"./nemo_retriever[all,dev]\" && uv pip install pytest pytest-cov; \
              python -m pytest --collect-only -q $TEST_PATHS | grep '::' | shuf -n \"$N\" > /tmp/selected-tests.txt; \
              SELECTED=(); while IFS= read -r t; do SELECTED+=(\"\$t\"); done < /tmp/selected-tests.txt; \
              if [ \${#SELECTED[@]} -eq 0 ]; then echo 'No tests were selected' >&2; exit 1; fi; \
              python -m pytest -rs -m \"$MARKERS\" $COV_ARGS \"\${SELECTED[@]}\""
          fi

          if [ "${{ inputs.coverage }}" = "true" ]; then
            CID="$(docker create --platform "$PLATFORM" "$IMAGE" bash -lc "$CMD")"
            docker start -a "$CID"
            docker cp "$CID":/tmp/coverage.xml coverage.xml || true
            docker rm -f "$CID"
          else
            docker run --rm --platform "$PLATFORM" "$IMAGE" bash -lc "$CMD"
          fi

      - name: Upload coverage report
        if: ${{ inputs.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

      - name: Cleanup HF token file
        if: always()
        run: rm -f ./scripts/private_local/hf_token.txt
