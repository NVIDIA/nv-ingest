{{/*
Renders retriever-service.yaml from .Values.serviceConfig and mounts it at
/etc/nemo-retriever/retriever-service.yaml inside the service container.

NIM endpoint URLs are resolved at template time via nim.endpointURL: an
explicit URL in serviceConfig.nimEndpoints always wins; otherwise we
auto-wire the NIM Operator-managed in-cluster Service URL when the
apps.nvidia.com/v1alpha1 CRDs are present and the corresponding
`nimOperator.<key>.enabled` flag is true. Each operator-managed Service
inherits the NIMService resource name, so the mapping is fixed:
  page_elements                          -> nemotron-page-elements-v3                /v1/page-elements
  table_structure                        -> nemotron-table-structure-v1              /v1/table-structure
  ocr                                    -> nemotron-ocr-v2                          /v1/ocr
  nemotron_parse                         -> nemotron-parse                           /v1/chat/completions
  vlm_embed                              -> nemotron-3-embed-1b            /v1/embeddings
  rerankqa                               -> llama-nemotron-rerank-vl-1b-v2           /v1/ranking
  nemotron_3_nano_omni_30b_a3b_reasoning -> nemotron-3-nano-omni-30b-a3b-reasoning   /v1/chat/completions
  answer_llm                             -> Values.nimOperator.answer_llm.nimServiceName /v1
*/}}
{{- $ctx := . -}}
{{- $auth := $ctx.Values.serviceConfig.auth -}}
{{- $scopeTokenSecret := $auth.scopeTokenSecret -}}
{{- $internalAuth := $ctx.Values.serviceConfig.vectordb.internalAuth -}}
{{- if and $auth.enabled (not $auth.apiToken) (not $scopeTokenSecret.name) -}}
{{- fail "serviceConfig.auth.enabled=true requires serviceConfig.auth.scopeTokenSecret.name or serviceConfig.auth.apiToken." -}}
{{- end -}}
{{- if and (not $auth.enabled) (or $auth.apiToken $scopeTokenSecret.name) -}}
{{- fail "serviceConfig.auth.apiToken and serviceConfig.auth.scopeTokenSecret.name require serviceConfig.auth.enabled=true." -}}
{{- end -}}
{{- if and $auth.apiToken (not $auth.allowInsecureInlineApiToken) -}}
{{- fail "serviceConfig.auth.apiToken writes a credential to a ConfigMap; set serviceConfig.auth.allowInsecureInlineApiToken=true only for explicit insecure development use, or configure serviceConfig.auth.scopeTokenSecret.name." -}}
{{- end -}}
{{- if and $auth.apiToken $scopeTokenSecret.name -}}
{{- fail "serviceConfig.auth.apiToken and serviceConfig.auth.scopeTokenSecret.name are mutually exclusive." -}}
{{- end -}}
{{- if and $scopeTokenSecret.name (not $scopeTokenSecret.key) -}}
{{- fail "serviceConfig.auth.scopeTokenSecret.name requires serviceConfig.auth.scopeTokenSecret.key." -}}
{{- end -}}
{{- if and $internalAuth.enabled (not $internalAuth.existingSecret.name) -}}
{{- fail "serviceConfig.vectordb.internalAuth.enabled=true requires serviceConfig.vectordb.internalAuth.existingSecret.name." -}}
{{- end -}}
{{- if and $internalAuth.enabled (not $internalAuth.existingSecret.key) -}}
{{- fail "serviceConfig.vectordb.internalAuth.enabled=true requires serviceConfig.vectordb.internalAuth.existingSecret.key." -}}
{{- end -}}
{{- /*
  Split pull workers mount only the dedicated internal credential. Public
  scope-token Secrets stay on the gateway, and auth_headers() only knows
  api_token. Without internalAuth, workers claim /v1/internal/work/claim with
  empty headers while the gateway still requires a public bearer token.
*/ -}}
{{- if and (eq $ctx.Values.topology.mode "split") $auth.enabled $scopeTokenSecret.name (not $internalAuth.enabled) -}}
{{- fail "topology.mode=split with serviceConfig.auth.scopeTokenSecret.name requires serviceConfig.vectordb.internalAuth.enabled=true so pull workers can authenticate to /v1/internal/work/claim." -}}
{{- end -}}
{{- $pageElementsURL := include "nemo-retriever.nim.endpointURL" (dict "context" $ctx "key" "page_elements" "serviceName" "nemotron-page-elements-v3" "configKey" "pageElementsInvokeUrl" "invokePath" "/v1/page-elements") -}}
{{- $tableStructureURL := include "nemo-retriever.nim.endpointURL" (dict "context" $ctx "key" "table_structure" "serviceName" "nemotron-table-structure-v1" "configKey" "tableStructureInvokeUrl" "invokePath" "/v1/table-structure") -}}
{{- $ocrURL := include "nemo-retriever.nim.endpointURL" (dict "context" $ctx "key" "ocr" "serviceName" $ctx.Values.nimOperator.ocr.nimServiceName "configKey" "ocrInvokeUrl" "invokePath" "/v1/ocr") -}}
{{- $nemotronParseURL := include "nemo-retriever.nim.endpointURL" (dict "context" $ctx "key" "nemotron_parse" "serviceName" "nemotron-parse" "configKey" "nemotronParseInvokeUrl" "invokePath" "/v1/chat/completions") -}}
{{- $nemotronParseModel := $ctx.Values.serviceConfig.nimEndpoints.nemotronParseModel | default "" -}}
{{- /* Infer the model only for the auto-wired operator endpoint. */ -}}
{{- if and (not $nemotronParseModel) (not $ctx.Values.serviceConfig.nimEndpoints.nemotronParseInvokeUrl) $nemotronParseURL -}}
{{- $parseRepository := $ctx.Values.nimOperator.nemotron_parse.image.repository | default "" -}}
{{- if regexMatch "(^|/)nemotron-parse-v1\\.2$" $parseRepository -}}
{{- $nemotronParseModel = "nvidia/nemotron-parse-v1.2" -}}
{{- else if regexMatch "(^|/)nemotron-parse-v2\\.0$" $parseRepository -}}
{{- $nemotronParseModel = "nvidia/nemotron-parse-v2.0" -}}
{{- end -}}
{{- end -}}
{{- $embedURL := include "nemo-retriever.nim.endpointURL" (dict "context" $ctx "key" "vlm_embed" "serviceName" $ctx.Values.nimOperator.vlm_embed.nimServiceName "configKey" "embedInvokeUrl" "invokePath" "/v1/embeddings") -}}
{{- $rerankURL := include "nemo-retriever.nim.endpointURL" (dict "context" $ctx "key" "rerankqa" "serviceName" "llama-nemotron-rerank-vl-1b-v2" "configKey" "rerankInvokeUrl" "invokePath" "/v1/ranking") -}}
{{- /*
  Model name resolution for the remote rerank endpoint:
    1. Explicit `serviceConfig.nimEndpoints.rerankModelName` always wins.
    2. Else, when a rerank URL was resolved (explicit or operator),
       fall back to the canonical VL reranker model id so /v1/query
       with rerank=true does not inherit the service's text-only default.
    3. Else, empty string — leaves `rerank_model_name: null` in the
       generated service config.
*/}}
{{- $rerankModelName := $ctx.Values.serviceConfig.nimEndpoints.rerankModelName | default "" -}}
{{- if and (not $rerankModelName) $rerankURL -}}
{{- $rerankModelName = "nvidia/llama-nemotron-rerank-vl-1b-v2" -}}
{{- end -}}
{{- $captionURL := include "nemo-retriever.nim.endpointURL" (dict "context" $ctx "key" "nemotron_3_nano_omni_30b_a3b_reasoning" "serviceName" "nemotron-3-nano-omni-30b-a3b-reasoning" "configKey" "captionInvokeUrl" "invokePath" "/v1/chat/completions") -}}
{{- /*
  Model name resolution for the remote caption endpoint:
    1. Explicit `serviceConfig.nimEndpoints.captionModelName` always wins.
    2. Else, when a caption URL was resolved (explicit or operator),
       fall back to the canonical Omni remote model id (matches
       `nemo_retriever.caption.model_profiles.OMNI_REMOTE_MODEL_ID`).
    3. Else, empty string — leaves `caption_model_name: null` in the
       generated service config and `caption_enabled` stays false.
*/}}
{{- $captionModelName := $ctx.Values.serviceConfig.nimEndpoints.captionModelName | default "" -}}
{{- if and (not $captionModelName) $captionURL -}}
{{- $captionModelName = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning" -}}
{{- end -}}
{{- $audioGrpcEndpoint := $ctx.Values.serviceConfig.nimEndpoints.audioGrpcEndpoint | default "" -}}
{{- $llmAPIBase := $ctx.Values.serviceConfig.llm.apiBase | default "" -}}
{{- $llmOperatorAPIBase := "" -}}
{{- if not $llmAPIBase -}}
{{- $llmOperatorAPIBase = include "nemo-retriever.nimOperator.url" (dict "context" $ctx "key" "answer_llm" "serviceName" $ctx.Values.nimOperator.answer_llm.nimServiceName "invokePath" "/v1") -}}
{{- $llmAPIBase = $llmOperatorAPIBase -}}
{{- end -}}
{{- $llmModel := $ctx.Values.serviceConfig.llm.model | default "" -}}
{{- if and (not $llmModel) $llmOperatorAPIBase -}}
{{- $llmModel = $ctx.Values.nimOperator.answer_llm.model | default "" -}}
{{- end -}}
{{- $llmEnabled := or $ctx.Values.serviceConfig.llm.enabled $llmAPIBase -}}
{{- $llmRagSystemPromptPrefix := $ctx.Values.serviceConfig.llm.ragSystemPromptPrefix | default "" -}}
{{- if and (not $llmRagSystemPromptPrefix) $llmOperatorAPIBase -}}
{{- $llmRagSystemPromptPrefix = $ctx.Values.nimOperator.answer_llm.ragSystemPromptPrefix | default "" -}}
{{- end -}}

{{- define "nemo-retriever.configBody" -}}
{{- $rawMaxUploadBytes := .Values.serviceConfig.resources.maxUploadBytes -}}
{{- $maxUploadBytes := toString $rawMaxUploadBytes -}}
{{- if kindIs "float64" $rawMaxUploadBytes -}}
{{- $maxUploadBytes = printf "%.0f" $rawMaxUploadBytes -}}
{{- end -}}
{{- if or (not (regexMatch "^[1-9][0-9]*$" $maxUploadBytes)) (and (kindIs "float64" $rawMaxUploadBytes) (ne $rawMaxUploadBytes (float64 $maxUploadBytes))) -}}
{{- fail "serviceConfig.resources.maxUploadBytes must be a positive integer" -}}
{{- end -}}
{{- $rawSidecarMaxPayloadBytes := .Values.serviceConfig.sidecarStore.maxPayloadBytes -}}
{{- $sidecarMaxPayloadBytes := toString $rawSidecarMaxPayloadBytes -}}
{{- if kindIs "float64" $rawSidecarMaxPayloadBytes -}}
{{- $sidecarMaxPayloadBytes = printf "%.0f" $rawSidecarMaxPayloadBytes -}}
{{- end -}}
{{- if or (not (regexMatch "^[1-9][0-9]*$" $sidecarMaxPayloadBytes)) (and (kindIs "float64" $rawSidecarMaxPayloadBytes) (ne $rawSidecarMaxPayloadBytes (float64 $sidecarMaxPayloadBytes))) -}}
{{- fail "serviceConfig.sidecarStore.maxPayloadBytes must be a positive integer" -}}
{{- end -}}
{{- if gt (int $sidecarMaxPayloadBytes) (int $maxUploadBytes) -}}
{{- fail "serviceConfig.sidecarStore.maxPayloadBytes must not exceed serviceConfig.resources.maxUploadBytes" -}}
{{- end -}}
server:
  host: {{ .Values.serviceConfig.server.host | quote }}
  port: {{ .Values.serviceConfig.server.port }}

logging:
  level: {{ .Values.serviceConfig.logging.level | quote }}
  file: {{ .Values.serviceConfig.logging.file | quote }}
  format: {{ .Values.serviceConfig.logging.format | quote }}

nim_endpoints:
  page_elements_invoke_url: {{ .pageElementsURL | quote }}
  table_structure_invoke_url: {{ .tableStructureURL | quote }}
  ocr_invoke_url: {{ .ocrURL | quote }}
  nemotron_parse_invoke_url: {{ if .nemotronParseURL }}{{ .nemotronParseURL | quote }}{{ else }}null{{ end }}
  nemotron_parse_model: {{ if .nemotronParseModel }}{{ .nemotronParseModel | quote }}{{ else }}null{{ end }}
  embed_invoke_url: {{ .embedURL | quote }}
  embed_model_name: {{ .Values.serviceConfig.vectordb.embedModel | quote }}
{{- if .Values.serviceConfig.vectordb.embedModelProviderPrefix }}
  embed_model_provider_prefix: {{ .Values.serviceConfig.vectordb.embedModelProviderPrefix | quote }}
{{- else }}
  embed_model_provider_prefix: null
{{- end }}
  rerank_invoke_url: {{ if .rerankURL }}{{ .rerankURL | quote }}{{ else }}null{{ end }}
  rerank_model_name: {{ if .rerankModelName }}{{ .rerankModelName | quote }}{{ else }}null{{ end }}
  caption_invoke_url: {{ if .captionURL }}{{ .captionURL | quote }}{{ else }}null{{ end }}
  caption_model_name: {{ if .captionModelName }}{{ .captionModelName | quote }}{{ else }}null{{ end }}
  audio_grpc_endpoint: {{ if .audioGrpcEndpoint }}{{ .audioGrpcEndpoint | quote }}{{ else }}null{{ end }}
  api_key: null

local_models:
  enabled: {{ .Values.serviceConfig.localModels.enabled }}
  hf_cache_dir: {{ if .Values.serviceConfig.localModels.hfCacheDir }}{{ .Values.serviceConfig.localModels.hfCacheDir | quote }}{{ else }}null{{ end }}
  device: {{ if .Values.serviceConfig.localModels.device }}{{ .Values.serviceConfig.localModels.device | quote }}{{ else }}null{{ end }}
  warmup_on_startup: {{ .Values.serviceConfig.localModels.warmupOnStartup }}
  max_tasks_per_child: {{ if .Values.serviceConfig.localModels.maxTasksPerChild }}{{ .Values.serviceConfig.localModels.maxTasksPerChild }}{{ else }}null{{ end }}
  max_process_pool_workers: {{ .Values.serviceConfig.localModels.maxProcessPoolWorkers }}
  extract:
    enabled: {{ .Values.serviceConfig.localModels.extract.enabled }}
    use_table_structure: {{ .Values.serviceConfig.localModels.extract.useTableStructure }}
    ocr_version: {{ .Values.serviceConfig.localModels.extract.ocrVersion | quote }}
    ocr_lang: {{ if .Values.serviceConfig.localModels.extract.ocrLang }}{{ .Values.serviceConfig.localModels.extract.ocrLang | quote }}{{ else }}null{{ end }}
  embed:
    enabled: {{ .Values.serviceConfig.localModels.embed.enabled }}
    model_name: {{ .Values.serviceConfig.localModels.embed.modelName | quote }}
    local_ingest_embed_backend: {{ .Values.serviceConfig.localModels.embed.localIngestEmbedBackend | quote }}
    gpu_memory_utilization: {{ .Values.serviceConfig.localModels.embed.gpuMemoryUtilization }}
  asr:
    enabled: {{ .Values.serviceConfig.localModels.asr.enabled }}

mcp:
  enabled: {{ .Values.serviceConfig.mcp.enabled }}
  path: {{ .Values.serviceConfig.mcp.path | quote }}
  base_url: {{ if .Values.serviceConfig.mcp.baseUrl }}{{ .Values.serviceConfig.mcp.baseUrl | quote }}{{ else }}null{{ end }}
  enable_write_tools: {{ .Values.serviceConfig.mcp.enableWriteTools }}
  query_methods: {{ .Values.serviceConfig.mcp.queryMethods | default "classic" | quote }}
  max_concurrency: {{ .Values.serviceConfig.mcp.maxConcurrency }}
  request_timeout_s: {{ .Values.serviceConfig.mcp.requestTimeoutS }}
  ingest_timeout_s: {{ .Values.serviceConfig.mcp.ingestTimeoutS }}
  poll_interval_s: {{ .Values.serviceConfig.mcp.pollIntervalS }}

llm:
  enabled: {{ if .llmEnabled }}true{{ else }}false{{ end }}
  model: {{ .llmModel | quote }}
  api_base: {{ if .llmAPIBase }}{{ .llmAPIBase | quote }}{{ else }}null{{ end }}
  api_key: null
  temperature: {{ .Values.serviceConfig.llm.temperature }}
  top_p: {{ if eq .Values.serviceConfig.llm.topP nil }}null{{ else }}{{ .Values.serviceConfig.llm.topP }}{{ end }}
  max_tokens: {{ .Values.serviceConfig.llm.maxTokens }}
  extra_params: {{ toJson .Values.serviceConfig.llm.extraParams }}
  num_retries: {{ .Values.serviceConfig.llm.numRetries }}
  timeout: {{ .Values.serviceConfig.llm.timeout }}
  rag_system_prompt: {{ if .Values.serviceConfig.llm.ragSystemPrompt }}{{ .Values.serviceConfig.llm.ragSystemPrompt | quote }}{{ else }}null{{ end }}
  rag_system_prompt_prefix: {{ if .llmRagSystemPromptPrefix }}{{ .llmRagSystemPromptPrefix | quote }}{{ else }}null{{ end }}
  reasoning_enabled: {{ .Values.serviceConfig.llm.reasoningEnabled }}

agentic:
  enabled: {{ .Values.serviceConfig.agentic.enabled }}
  llm_model: {{ if .Values.serviceConfig.agentic.llmModel }}{{ .Values.serviceConfig.agentic.llmModel | quote }}{{ else }}null{{ end }}
  invoke_url: {{ if .Values.serviceConfig.agentic.invokeUrl }}{{ .Values.serviceConfig.agentic.invokeUrl | quote }}{{ else }}null{{ end }}
  reasoning_effort: {{ if .Values.serviceConfig.agentic.reasoningEffort }}{{ .Values.serviceConfig.agentic.reasoningEffort | quote }}{{ else }}null{{ end }}
  backend_top_k: {{ .Values.serviceConfig.agentic.backendTopK }}
  react_max_steps: {{ .Values.serviceConfig.agentic.reactMaxSteps }}
  text_truncation: {{ .Values.serviceConfig.agentic.textTruncation }}
  temperature: {{ .Values.serviceConfig.agentic.temperature }}
  request_timeout_s: {{ .Values.serviceConfig.agentic.requestTimeoutS }}

pipeline:
  realtime_workers: {{ .Values.serviceConfig.pipeline.realtimeWorkers }}
  realtime_queue_size: {{ .Values.serviceConfig.pipeline.realtimeQueueSize }}
  batch_workers: {{ .Values.serviceConfig.pipeline.batchWorkers }}
  batch_queue_size: {{ .Values.serviceConfig.pipeline.batchQueueSize }}

work_queue:
  gateway_url: "http://{{ .gatewaySvc }}:{{ .Values.networkService.port }}"
  spool_directory: {{ .Values.serviceConfig.workQueue.spoolDirectory | quote }}
  spool_limit_bytes: {{ .Values.serviceConfig.workQueue.spoolLimitBytes }}
  claim_timeout_s: {{ .Values.serviceConfig.workQueue.claimTimeoutS }}
  lease_ttl_s: {{ .Values.serviceConfig.workQueue.leaseTtlS }}
  heartbeat_interval_s: {{ .Values.serviceConfig.workQueue.heartbeatIntervalS }}
  max_delivery_attempts: {{ .Values.serviceConfig.workQueue.maxDeliveryAttempts }}
  max_active_leases_realtime: {{ .Values.serviceConfig.workQueue.maxActiveLeases.realtime }}
  max_active_leases_batch: {{ .Values.serviceConfig.workQueue.maxActiveLeases.batch }}

resources:
  max_memory_mb: {{ .Values.serviceConfig.resources.maxMemoryMb | default "null" }}
  max_cpu_cores: {{ .Values.serviceConfig.resources.maxCpuCores | default "null" }}
  gpu_devices: {{ toJson .Values.serviceConfig.resources.gpuDevices }}
  max_upload_bytes: {{ $maxUploadBytes }}

sidecar_store:
  max_payload_bytes: {{ $sidecarMaxPayloadBytes }}

auth:
  enabled: {{ .Values.serviceConfig.auth.enabled }}
  api_token: {{ .Values.serviceConfig.auth.apiToken | default "null" }}
  default_scope: {{ .Values.serviceConfig.auth.defaultScope | quote }}
  allow_unscoped_dev: {{ .Values.serviceConfig.auth.allowUnscopedDev }}
  header_name: {{ .Values.serviceConfig.auth.headerName | quote }}
  bypass_paths: {{ toJson .Values.serviceConfig.auth.bypassPaths }}

{{- if .Values.serviceConfig.vectordb.enabled }}
vectordb:
  enabled: true
  lancedb_uri: {{ .Values.serviceConfig.vectordb.lancedbUri | quote }}
  table_name: {{ .Values.serviceConfig.vectordb.tableName | quote }}
  index_mode: {{ .Values.serviceConfig.vectordb.indexMode | quote }}
  embed_model: {{ .Values.serviceConfig.vectordb.embedModel | quote }}
{{- if .Values.serviceConfig.vectordb.embedModelProviderPrefix }}
  embed_model_provider_prefix: {{ .Values.serviceConfig.vectordb.embedModelProviderPrefix | quote }}
{{- else }}
  embed_model_provider_prefix: null
{{- end }}
  vectordb_url: "http://{{ .vectordbSvc }}:{{ .vectordbPort }}"
  write_timeout_s: {{ .Values.serviceConfig.vectordb.writeTimeoutSeconds | default 300 }}
{{- else }}
vectordb:
  enabled: false
{{- end }}
{{- end -}}

{{- $vectordbSvc := printf "%s-vectordb" (include "nemo-retriever.fullname" .) -}}
{{- $vectordbPort := ((.Values.topology.vectordb).port | default 7671) -}}
{{- $gatewaySvc := include "nemo-retriever.fullname" . -}}
{{- if eq .Values.topology.mode "standalone" }}
# =========================================================================
# Standalone mode — single ConfigMap with mode: standalone
# =========================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nemo-retriever.configMapName" . }}
  labels:
    {{- include "nemo-retriever.labels" . | nindent 4 }}
data:
  retriever-service.yaml: |
    mode: standalone
{{ include "nemo-retriever.configBody" (dict "Values" .Values "gatewaySvc" $gatewaySvc "pageElementsURL" $pageElementsURL "tableStructureURL" $tableStructureURL "ocrURL" $ocrURL "nemotronParseURL" $nemotronParseURL "nemotronParseModel" $nemotronParseModel "embedURL" $embedURL "rerankURL" $rerankURL "rerankModelName" $rerankModelName "captionURL" $captionURL "captionModelName" $captionModelName "audioGrpcEndpoint" $audioGrpcEndpoint "llmEnabled" $llmEnabled "llmModel" $llmModel "llmAPIBase" $llmAPIBase "llmRagSystemPromptPrefix" $llmRagSystemPromptPrefix "vectordbSvc" $vectordbSvc "vectordbPort" $vectordbPort) | indent 4 }}
{{- else }}
# =========================================================================
# Split mode — one ConfigMap per role with the appropriate mode + gateway
# =========================================================================
{{- $fullname := include "nemo-retriever.fullname" . -}}
{{- $realtimeSvc := printf "%s-realtime" $fullname -}}
{{- $gatewaySvc = printf "%s-gateway" $fullname -}}
{{- $batchSvc := printf "%s-batch" $fullname -}}
{{- $port := .Values.networkService.port -}}
{{- $roles := list "gateway" "realtime" "batch" }}
{{- range $role := $roles }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nemo-retriever.role.configMapName" (dict "context" $ "role" $role) }}
  labels:
    {{- include "nemo-retriever.role.labels" (dict "context" $ "role" $role) | nindent 4 }}
data:
  retriever-service.yaml: |
    mode: {{ $role }}
    {{- if eq $role "gateway" }}
    gateway:
      realtime_url: "http://{{ $realtimeSvc }}:{{ $port }}"
      batch_url: "http://{{ $batchSvc }}:{{ $port }}"
      timeout_s: 300.0
      max_connections: 100
    {{- end }}
{{ include "nemo-retriever.configBody" (dict "Values" $.Values "gatewaySvc" $gatewaySvc "pageElementsURL" $pageElementsURL "tableStructureURL" $tableStructureURL "ocrURL" $ocrURL "nemotronParseURL" $nemotronParseURL "nemotronParseModel" $nemotronParseModel "embedURL" $embedURL "rerankURL" $rerankURL "rerankModelName" $rerankModelName "captionURL" $captionURL "captionModelName" $captionModelName "audioGrpcEndpoint" $audioGrpcEndpoint "llmEnabled" $llmEnabled "llmModel" $llmModel "llmAPIBase" $llmAPIBase "llmRagSystemPromptPrefix" $llmRagSystemPromptPrefix "vectordbSvc" $vectordbSvc "vectordbPort" $vectordbPort) | indent 4 }}
{{- end }}
{{- end }}
